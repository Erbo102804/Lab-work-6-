{% extends 'crud/base.html' %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<h2>{{ product.name }}</h2>
<p>{{ product.description }}</p>
<p>Цена: {{ product.price }} | Количество: {{ product.quantity }}</p>
<a class="btn" href="{% url 'crud:update' product.pk %}">Изменить</a>
<a class="btn" href="{% url 'crud:delete' product.pk %}">Удалить</a>
{% endblock %}
